# Pulls the MooshieUI GitHub wiki into ./wiki and commits any change to main.
# Cloudflare Pages then rebuilds mooshieui.com with the new pages.
name: Sync wiki

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Copy the wiki
        run: node scripts/sync-wiki.mjs

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- wiki)" ]; then
            echo "Wiki unchanged."
            exit 0
          fi
          commit=$(node -p "require('./wiki/source.json').commit.slice(0, 7)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wiki
          git commit -m "Sync wiki to ${commit}"
          git push origin HEAD:main
